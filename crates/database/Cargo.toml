[package]
name = "dhpanel-database"
description = "PostgreSQL pool, transaction helpers, migrations and tenant-scoped repository base."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dhpanel-domain.workspace = true
# Async PostgreSQL driver + migrations (fixed stack). No TLS yet: the database
# listens on localhost / a private network; TLS is added with remote DB support.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time"] }
# Database URL stays wrapped so it never reaches logs.
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
