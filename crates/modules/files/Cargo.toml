[package]
name = "dhpanel-mod-files"
description = "Files module: the file manager's API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dhpanel-audit.workspace = true
dhpanel-database.workspace = true
dhpanel-http-kit.workspace = true
dhpanel-node-protocol.workspace = true
dhpanel-rbac.workspace = true
dhpanel-session.workspace = true
dhpanel-settings.workspace = true
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
dhpanel-fileops.workspace = true
dhpanel-safe-fs.workspace = true
secrecy = "0.10"
dhpanel-kernel.workspace = true
dhpanel-cache.workspace = true
dhpanel-mod-auth.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v7", "v4"] }
