[package]
name = "dhpanel-mod-nodes"
description = "Nodes module: add servers to the panel with one-time enrollment tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dhpanel-audit.workspace = true
dhpanel-database.workspace = true
dhpanel-http-kit.workspace = true
dhpanel-rbac.workspace = true
dhpanel-session.workspace = true
axum = "0.8"
base64 = "0.23"
getrandom = "0.4"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
dhpanel-cache.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
