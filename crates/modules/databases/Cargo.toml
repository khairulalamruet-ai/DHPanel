[package]
name = "dhpanel-mod-databases"
description = "Databases module: the databases, users and grants of a hosting account."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dhpanel-audit.workspace = true
dhpanel-auth-core.workspace = true
dhpanel-database.workspace = true
dhpanel-domain.workspace = true
dhpanel-http-kit.workspace = true
dhpanel-node-protocol.workspace = true
dhpanel-rbac.workspace = true
dhpanel-session.workspace = true
dhpanel-settings.workspace = true
axum = "0.8"
# The dump's checksum, and the token's hash.
sha2 = "0.11"
# The spool file of an upload.
tokio = { version = "1", features = ["fs", "io-util", "rt"] }
# Serves the spool file to the node (ranges, headers).
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
secrecy = "0.10"
dhpanel-kernel.workspace = true
dhpanel-cache.workspace = true
dhpanel-mod-auth.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde", "v7", "v4"] }
