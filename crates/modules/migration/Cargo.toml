[package]
name = "dhpanel-mod-migration"
description = "Migration module: bring an account over from another hosting panel (T15.04, T15.06)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dhpanel-audit.workspace = true
dhpanel-database.workspace = true
dhpanel-domain.workspace = true
dhpanel-http-kit.workspace = true
dhpanel-import.workspace = true
dhpanel-kernel.workspace = true
dhpanel-rbac.workspace = true
dhpanel-session.workspace = true
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json"] }
sha2 = "0.11"
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
dhpanel-cache.workspace = true
dhpanel-mod-auth.workspace = true
secrecy = "0.10"
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
