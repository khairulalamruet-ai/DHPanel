[package]
name = "dhpanel-control-api"
description = "DHPanel control plane HTTP API (Axum)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dhpanel-control-api"
path = "src/main.rs"

[features]
default = []
# Build with OpenTelemetry span export (see dhpanel-observability).
otel = ["dhpanel-observability/otel"]

[dependencies]
dhpanel-common.workspace = true
dhpanel-config.workspace = true
dhpanel-http-kit.workspace = true
dhpanel-observability.workspace = true
# HTTP framework and async runtime (fixed stack).
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
