[package]
name = "dhpanel-control-api"
description = "DHPanel control plane HTTP API (Axum)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dhpanel-control-api"
path = "src/main.rs"

[features]
default = []
# Build with OpenTelemetry span export (see dhpanel-observability).
otel = ["dhpanel-observability/otel"]

[dependencies]
dhpanel-audit.workspace = true
dhpanel-auth-core.workspace = true
# Reads the master key out of its SecretString wrapper at startup.
secrecy = "0.10"
dhpanel-cache.workspace = true
dhpanel-common.workspace = true
dhpanel-config.workspace = true
dhpanel-database.workspace = true
serde_json = "1"
dhpanel-http-kit.workspace = true
dhpanel-mod-admin.workspace = true
dhpanel-mod-auth.workspace = true
dhpanel-mod-nodes.workspace = true
dhpanel-mod-system.workspace = true
dhpanel-dispatcher.workspace = true
dhpanel-events.workspace = true
dhpanel-kernel.workspace = true
dhpanel-node-gateway.workspace = true
dhpanel-operations.workspace = true
dhpanel-observability.workspace = true
dhpanel-pki.workspace = true
dhpanel-session.workspace = true
# HTTP framework and async runtime (fixed stack).
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
# Loading the node CA checks its validity against the current time.
time = "0.3"
# Standard HTTP middleware: timeout, body limit, gzip, panic -> 500.
tower-http = { version = "0.7", features = ["timeout", "limit", "compression-gzip", "catch-panic"] }
utoipa = "6"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }

[dev-dependencies]
# The manifest tests compare declared permission keys with the ones the code checks.
dhpanel-rbac.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
