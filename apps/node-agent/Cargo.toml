[package]
name = "dhpanel-node-agent"
description = "DHPanel per-server node agent (typed operations only, never a shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "dhpanel_node_agent"
path = "src/lib.rs"

[[bin]]
# `dhpanel-agent` is the name used in the enrol command shown by the panel.
name = "dhpanel-agent"
path = "src/main.rs"

[dependencies]
dhpanel-common.workspace = true
dhpanel-node-protocol.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
clap = { version = "4", features = ["derive", "env"] }
# The agent makes its own key and certificate signing request.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
# Checks what the control plane sends back before anything is stored.
x509-parser = { version = "0.18", features = ["verify"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0.21"
time = { version = "0.3", features = ["formatting"] }
# `run` waits for a shutdown signal; the control-plane connection (T02.08) will use the same runtime.
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "net", "sync"] }
# The only network call the agent makes before it has a certificate: one HTTPS
# POST to enrol. `ureq` is blocking and small; it uses rustls with the `ring`
# backend (the same one rcgen uses) and the bundled Mozilla root certificates.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
dhpanel-node-gateway.workspace = true
dhpanel-operations.workspace = true
# Tests play the control plane: they make a real CA, and the enrolment test runs
# the real enrollment endpoint on a local port.
dhpanel-audit.workspace = true
dhpanel-cache.workspace = true
dhpanel-database.workspace = true
dhpanel-http-kit.workspace = true
dhpanel-mod-nodes.workspace = true
dhpanel-pki.workspace = true
dhpanel-session.workspace = true
axum = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }

[lints]
workspace = true
