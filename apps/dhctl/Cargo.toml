[package]
name = "dhpanel-dhctl"
description = "DHPanel admin CLI for bootstrap, migrations and recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dhctl"
path = "src/main.rs"

[dependencies]
dhpanel-common.workspace = true
dhpanel-config.workspace = true
dhpanel-database.workspace = true
# Subcommand parsing; dhctl grows many commands (migrate, admin, ca, ...).
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
