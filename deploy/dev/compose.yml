# Optional Docker-based dev services (alternative to devenv.sh).
# Usage:
#   cp deploy/dev/.env.example deploy/dev/.env   # then set strong passwords
#   docker compose -f deploy/dev/compose.yml --env-file deploy/dev/.env up -d
# All ports bind to 127.0.0.1 only.
name: dhpanel-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dhpanel
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in deploy/dev/.env}
      POSTGRES_DB: dhpanel_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhpanel -d dhpanel_dev"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/dev/.env}"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Catches outgoing mail in development (web UI on http://127.0.0.1:8025).
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
