reference = "nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03"
note      = "nginx 1.30.6, unprivileged build (listens on 8080, runs as any user), Alpine"

