# The images a tenant stack may be built from (T04.06, T06.02).
#
# Only images listed here, pinned by digest, can ever be started for a tenant:
# the stack renderer refuses anything else, and so does the docker-manager
# crate (it does not accept tags). The first entry of a role is the one new
# stacks use; older entries stay allowed so existing stacks keep working until
# they are moved to the current one. PHP images carry the PHP version they run
# (`version`); the first PHP entry is the version new accounts start with, and
# an account may be moved to any version listed here.
#
# A PHP entry may also carry `preferred`: our own image for that version (built
# by .github/workflows/rust-images.yml from deploy/images/php, published to
# ghcr.io, with the extensions sites usually need). It is tried first; when it
# cannot be pulled the official image in `reference` is used, so a site never
# waits for our registry. Add `preferred` after the workflow prints the digest.
#
# To change an image: pull it, check it (scan, user, size), copy the digest
# that `docker image inspect --format '{{index .RepoDigests 0}}'` prints, add it
# here as the first entry of its role in a reviewed change.

