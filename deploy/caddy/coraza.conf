# The base settings of the WAF (T11.01), read before the OWASP Core Rule Set.
# SecRuleEngine is set by the site (On blocks, DetectionOnly only logs, Off does nothing).
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecArgumentsLimit 1000
# What a block leaves in the log: the rule, the address, the address asked for.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(403|5[0-9][0-9])$"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /dev/stderr
SecAuditLogFormat JSON
SecDebugLogLevel 0
