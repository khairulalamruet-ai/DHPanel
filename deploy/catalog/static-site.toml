# A site made of files only: a page to start from, no database.
slug           = "static-site"
name           = "Static site"
version        = "1.0"
description    = "A plain HTML page to start from; upload the rest with the file manager or FTP."
category       = "static"
needs_database = false

[[steps]]
type    = "write_file"
path    = "index.html"
content = """<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
</head>
<body>
<h1>{{title}}</h1>
<p>This site is ready. Replace this page with your own.</p>
</body>
</html>
"""
