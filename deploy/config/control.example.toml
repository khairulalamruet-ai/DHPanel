# DHPanel control plane configuration (example).
# Install as /etc/dhpanel/control.toml (mode 0640, owner root:dhpanel),
# or point DHPANEL_CONFIG at another path.
#
# Every key can be overridden by environment variables:
#   DHPANEL_<SECTION>__<KEY>, e.g. DHPANEL_DATABASE__MAX_CONNECTIONS=20
# Unknown keys are rejected at startup.

listen = "127.0.0.1:8080"

# Reverse proxies whose X-Forwarded-For header is trusted for the client IP
# (exact addresses). Set this to the local Caddy when it fronts the API;
# leave empty when clients connect directly, otherwise clients could spoof
# their address and dodge login lockouts.
trusted_proxies = []   # e.g. ["127.0.0.1", "::1"]

[log]
format = "json"          # json | pretty
filter = "info"          # EnvFilter directives, e.g. "info,dhpanel=debug"
# otlp_endpoint = "http://127.0.0.1:4318/v1/traces"   # needs a build with --features otel

[database]
# Put the URL in a file readable only by the service user (chmod 0600).
url_file = "/etc/dhpanel/secrets/database_url"
max_connections = 10

[redis]
url_file = "/etc/dhpanel/secrets/redis_url"

[auth]
# Argon2id password hashing cost. Raising these makes every login slower;
# existing hashes are upgraded on the next successful login.
# Default is the OWASP baseline (19 MiB, t=2). Benchmark the server first:
#   DHPANEL_BENCH_ARGON2=65536,3,1 cargo test -p dhpanel-auth-core --release -- --ignored --nocapture benchmark
# and aim for roughly 200 ms per hash.
argon2_memory_kib = 19456   # KiB, minimum 19456
argon2_iterations = 2       # minimum 2
argon2_parallelism = 1

# Sessions: idle window (sliding) and absolute lifetime (fixed).
session_idle_minutes = 30     # 5..=1440
session_absolute_hours = 12   # 1..=720

# Failed-login lockout. An account (or unknown login name) is locked after
# `lockout_threshold` failures within `lockout_window_minutes`; one client
# address (an IPv6 /64) after `ip_lockout_threshold`. Locked logins get
# 429 with Retry-After for `lockout_minutes`, even with the right password.
lockout_threshold = 5          # 1..=100
lockout_window_minutes = 15    # 1..=1440
lockout_minutes = 15           # 1..=1440
ip_lockout_threshold = 50      # lockout_threshold..=100000

# Two-factor authentication: the name authenticator apps show for this panel.
totp_issuer = "DHPanel"

[secrets]
# Master key that encrypts secrets stored in the database (TOTP secrets, ...).
# Create once and back it up separately from the database:
#   (umask 077; openssl rand -base64 32 > /etc/dhpanel/secrets/master_key)
# If it is lost, users must re-enrol 2FA; if it leaks together with a database
# dump, stored TOTP secrets are exposed.
master_key_file = "/etc/dhpanel/secrets/master_key"
