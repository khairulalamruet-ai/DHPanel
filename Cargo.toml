[workspace]
resolver = "3"
members = [
    "apps/control-api",
    "apps/worker",
    "apps/node-agent",
    "apps/priv-helper",
    "apps/dhctl",
    "crates/kernel",
    "crates/safe-fs",
    "crates/backup",
    "crates/backup-dest",
    "crates/fileops",
    "crates/auth-core",
    "crates/cache",
    "crates/common",
    "crates/config",
    "crates/domain",
    "crates/database",
    "crates/http-kit",
    "crates/observability",
    "crates/session",
    "crates/rbac",
    "crates/audit",
    "crates/node-protocol",
    "crates/node-gateway",
    "crates/operations",
    "crates/dispatcher",
    "crates/events",
    "crates/feature-gate",
    "crates/settings",
    "crates/tenant-stack",
    "crates/web-config",
    "crates/docker-manager",
    "crates/pki",
    "crates/modules/auth",
    "crates/modules/admin",
    "crates/modules/nodes",
    "crates/modules/system",
    "crates/modules/plans",
    "crates/modules/users",
    "crates/modules/domains",
    "crates/modules/databases",
    "crates/modules/files",
    "crates/modules/backups",
    "crates/dns",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-DHPanel-Proprietary"
publish = false
repository = "https://example.invalid/dhpanel"

[workspace.dependencies]
# Internal crates. External dependencies are added here (with a reason in the PR) by later tasks.
dhpanel-kernel = { path = "crates/kernel" }
dhpanel-auth-core = { path = "crates/auth-core" }
dhpanel-cache = { path = "crates/cache" }
dhpanel-common = { path = "crates/common" }
dhpanel-config = { path = "crates/config" }
dhpanel-domain = { path = "crates/domain" }
dhpanel-safe-fs = { path = "crates/safe-fs" }
dhpanel-backup = { path = "crates/backup" }
dhpanel-backup-dest = { path = "crates/backup-dest" }
dhpanel-fileops = { path = "crates/fileops" }
dhpanel-database = { path = "crates/database" }
dhpanel-http-kit = { path = "crates/http-kit" }
dhpanel-observability = { path = "crates/observability" }
dhpanel-session = { path = "crates/session" }
dhpanel-rbac = { path = "crates/rbac" }
dhpanel-audit = { path = "crates/audit" }
dhpanel-node-protocol = { path = "crates/node-protocol" }
dhpanel-pki = { path = "crates/pki" }
dhpanel-web-config = { path = "crates/web-config" }
dhpanel-mod-auth = { path = "crates/modules/auth" }
dhpanel-mod-admin = { path = "crates/modules/admin" }
dhpanel-mod-nodes = { path = "crates/modules/nodes" }
dhpanel-mod-system = { path = "crates/modules/system" }
dhpanel-mod-plans = { path = "crates/modules/plans" }
dhpanel-mod-users = { path = "crates/modules/users" }
dhpanel-mod-domains = { path = "crates/modules/domains" }
dhpanel-mod-databases = { path = "crates/modules/databases" }
dhpanel-mod-files = { path = "crates/modules/files" }
dhpanel-mod-backups = { path = "crates/modules/backups" }
dhpanel-dns = { path = "crates/dns" }
dhpanel-node-gateway = { path = "crates/node-gateway" }
dhpanel-operations = { path = "crates/operations" }
dhpanel-dispatcher = { path = "crates/dispatcher" }
dhpanel-events = { path = "crates/events" }
dhpanel-feature-gate = { path = "crates/feature-gate" }
dhpanel-settings = { path = "crates/settings" }
dhpanel-tenant-stack = { path = "crates/tenant-stack" }
dhpanel-docker-manager = { path = "crates/docker-manager" }

# External crates shared by the agent and the control plane's agent port (T02.08).
# TLS 1.3 only, `ring` backend (the one rcgen and ureq already use); the WebSocket
# layer runs over a TLS stream we set up ourselves, so mTLS stays in our hands.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
