# Administrators, roles and permissions (crates/modules/admin, crates/rbac).
[module]
name       = "rbac"
version    = "0.1.0"
title      = { en = "Administrators and roles", bn = "অ্যাডমিন ও রোল" }
category   = "core"
core       = true
depends_on = ["auth"]

[permissions]
keys = [
    "admin.administrators.read",
    "admin.administrators.manage",
    "admin.roles.read",
    "admin.roles.manage",
]

[ui]
admin_nav = { group = "Access", order = 10, icon = "shield" }
